spring.application.name=OpsPilotBackend
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8082/realms/opspilot}
spring.security.oauth2.resourceserver.jwt.audiences=${KEYCLOAK_API_AUDIENCE:opspilot-backend}

# Fixed delay between completed rounds; HTTP checks only, with process-local locking.
opspilot.monitoring.enabled=${MONITORING_ENABLED:true}
opspilot.monitoring.interval-ms=${MONITORING_INTERVAL_MS:60000}
opspilot.monitoring.initial-delay-ms=${MONITORING_INITIAL_DELAY_MS:10000}
opspilot.monitoring.connect-timeout-ms=${MONITORING_CONNECT_TIMEOUT_MS:2000}
opspilot.monitoring.request-timeout-ms=${MONITORING_REQUEST_TIMEOUT_MS:5000}
opspilot.monitoring.workers=${MONITORING_WORKERS:4}
opspilot.monitoring.allowed-ports=${MONITORING_ALLOWED_PORTS:80,443}
